
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterMark Remover</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f7ff;
font-family:Arial,sans-serif;padding:22px}
main{max-width:720px;margin:auto}
header{text-align:center;padding:25px 0}
h1{margin:0;color:#70a5ff;font-size:36px}
p{color:#aab6ce;line-height:1.5}
.panel{background:#151d32;padding:18px;
border:1px solid #293653;border-radius:16px;margin:16px 0}
button,select,input{font:inherit}
button,select,.upload{padding:12px;border-radius:9px;
border:1px solid #405477;background:#202d48;color:white}
button{cursor:pointer}
button:disabled{opacity:.4}
.upload{display:block;text-align:center;margin:12px 0}
input[type=file]{max-width:100%}
#canvas{display:block;width:100%;height:auto;
border-radius:10px;touch-action:none;background:#090d16}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.row>*{flex:1;min-width:120px}
label{display:block;margin:12px 0 6px}
small{color:#aab6ce}
a{color:#8bb6ff}
</style>
</head>
<body>
<main>
<header>
<h1>WaterMark Remover</h1>
<p>Clean up Watermarks. Your files stay in your browser.</p>
</header>

<section class="panel">
<label class="upload">
Choose an image
<input id="file" type="file" accept="image/*">
</label>
<p id="status">Choose an image to get started.</p>
<canvas id="canvas"></canvas>
<small>Drag across the image to select the area to edit.</small>

<label for="mode">Cleanup method</label>
<select id="mode" style="width:100%">
<option value="blur">Blur selected area</option>
<option value="pixel">Pixelate selected area</option>
<option value="crop">Crop to selected area</option>
</select>

<div class="row">
<button id="apply" disabled>Apply cleanup</button>
<button id="reset" disabled>Reset image</button>
</div>
<button id="download" disabled style="width:100%">
Download PNG
</button>
</section>
<p><small>Only edit content you own or have permission to modify.
This starter version does not use generative AI inpainting.</small></p>
</main>

<script>
const file = document.getElementById("file");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const apply = document.getElementById("apply");
const reset = document.getElementById("reset");
const download = document.getElementById("download");
const mode = document.getElementById("mode");

let original = null;
let selection = null;
let start = null;
let dragging = false;

function draw() {
  if (!original) return;
  canvas.width = original.width;
  canvas.height = original.height;
  ctx.putImageData(original, 0, 0);
  if (selection) {
    const {x,y,w,h} = selection;
    ctx.save();
    ctx.strokeStyle = "#70a5ff";
    ctx.lineWidth = Math.max(2, canvas.width / 300);
    ctx.setLineDash([8,5]);
    ctx.strokeRect(x,y,w,h);
    ctx.restore();
  }
}

function point(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(canvas.width,
      (e.clientX-r.left)*canvas.width/r.width)),
    y: Math.max(0, Math.min(canvas.height,
      (e.clientY-r.top)*canvas.height/r.height))
  };
}

file.addEventListener("change", () => {
  const f = file.files[0];
  if (!f) return;
  if (!f.type.startsWith("image/")) {
    status.textContent = "Please choose an image.";
    return;
  }
  if (f.size > 15*1024*1024) {
    status.textContent = "Choose an image under 15 MB.";
    return;
  }
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    const scale = Math.min(1, 2000/img.width, 2000/img.height);
    const temp = document.createElement("canvas");
    temp.width = Math.round(img.width*scale);
    temp.height = Math.round(img.height*scale);
    temp.getContext("2d").drawImage(img,0,0,temp.width,temp.height);
    original = temp.getContext("2d").getImageData(
      0,0,temp.width,temp.height);
    selection = null;
    draw();
    apply.disabled = false;
    reset.disabled = false;
    download.disabled = false;
    status.textContent = "Image ready. Select an area.";
  };
  img.onerror = () => status.textContent = "Could not load this image.";
  img.src = url;
});

canvas.addEventListener("pointerdown", e => {
  if (!original) return;
  canvas.setPointerCapture(e.pointerId);
  start = point(e);
  dragging = true;
  selection = {x:start.x,y:start.y,w:0,h:0};
  draw();
});

canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = point(e);
  selection = {
    x:Math.min(start.x,p.x), y:Math.min(start.y,p.y),
    w:Math.abs(p.x-start.x), h:Math.abs(p.y-start.y)
  };
  draw();
});

function stopDrag() {
  if (!dragging) return;
  dragging = false;
  if (selection && (selection.w<3 || selection.h<3)) {
    selection = null;
  }
  draw();
}
canvas.addEventListener("pointerup", stopDrag);
canvas.addEventListener("pointercancel", stopDrag);

apply.addEventListener("click", () => {
  if (!original || !selection ||
      selection.w<2 || selection.h<2) {
    status.textContent = "Select an area first.";
    return;
  }
  const {x,y,w,h} = selection;
  const sx=Math.round(x), sy=Math.round(y);
  const sw=Math.max(1,Math.round(w));
  const sh=Math.max(1,Math.round(h));

  if (mode.value === "crop") {
    const data = ctx.getImageData(sx,sy,sw,sh);
    original = data;
    selection = null;
    draw();
    status.textContent = "Crop complete.";
    return;
  }

  const temp = document.createElement("canvas");
  temp.width=canvas.width;
  temp.height=canvas.height;
  const t=temp.getContext("2d");
  t.putImageData(original,0,0);

  if (mode.value === "blur") {
    const patch=document.createElement("canvas");
    patch.width=sw; patch.height=sh;
    const p=patch.getContext("2d");
    p.filter="blur("+Math.max(4,Math.round(sw/18))+"px)";
    p.drawImage(temp,sx,sy,sw,sh,0,0,sw,sh);
    t.drawImage(patch,sx,sy);
  } else {
    const pw=Math.max(1,Math.round(sw/18));
    const ph=Math.max(1,Math.round(sh/18));
    const patch=document.createElement("canvas");
    patch.width=pw; patch.height=ph;
    patch.getContext("2d").drawImage(
      temp,sx,sy,sw,sh,0,0,pw,ph);
    t.imageSmoothingEnabled=false;
    t.drawImage(patch,0,0,pw,ph,sx,sy,sw,sh);
  }

  original=t.getImageData(0,0,canvas.width,canvas.height);
  selection=null;
  draw();
  status.textContent="Cleanup applied. You can download the image.";
});

reset.addEventListener("click", () => {
  if (!original) return;
  draw();
  selection=null;
  draw();
  status.textContent="Select an area to edit.";
});

download.addEventListener("click", () => {
  if (!original) return;
  const out=document.createElement("canvas");
  out.width=canvas.width;
  out.height=canvas.height;
  out.getContext("2d").putImageData(original,0,0);
  const a=document.createElement("a");
  a.download="cleanframe-edited.png";
  a.href=out.toDataURL("image/png");
  a.click();
});
</script>
</body>
</html>
